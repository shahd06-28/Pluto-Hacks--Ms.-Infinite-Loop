<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Women in Tech Search Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.4/marked.min.js"></script>
  <style>
    body { background-color: #f9fafb; }
    #loader { display: none; }
  </style>
</head>
<body>
<div class="container py-5">
  <h1 class="text-center fw-bold mb-4">💡 Women in Tech — Past, Present, Future</h1>

  <form id="query-form" class="row g-3 justify-content-center">
    <div class="col-12 col-md-8">
      <input type="text" id="query" name="query" class="form-control form-control-lg" placeholder="Ask something..." required>
    </div>
    <div class="col-12 col-md-2 d-grid">
      <button class="btn btn-dark btn-lg" type="submit">Search</button>
    </div>
  </form>

  <div class="text-center mt-4">
    <div id="loader" class="spinner-border text-dark" role="status"></div>
  </div>

  <div id="answer" class="mt-5"></div>
</div>

<script>
  const form = document.getElementById("query-form");
  const loader = document.getElementById("loader");
  const answerBox = document.getElementById("answer");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = document.getElementById("query").value.trim();
    if (!query) return;
    loader.style.display = "block";
    answerBox.innerHTML = "";

    try {
      const res = await fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const data = await res.json();
      loader.style.display = "none";
      if (data.answer) {
        answerBox.innerHTML = marked.parse(data.answer);
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      } else {
        answerBox.innerHTML = `<div class="alert alert-danger">Error: ${data.error || 'Unknown issue'}</div>`;
      }
    } catch (err) {
      loader.style.display = "none";
      answerBox.innerHTML = `<div class="alert alert-danger">Network error — please try again.</div>`;
    }
  });
</script>
</body>
</html>
