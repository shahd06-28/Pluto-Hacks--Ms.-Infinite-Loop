<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ms. Infinite Loop 🌸</title>
<style>
body {
  font-family: "Pixelify Sans", monospace;
  background: linear-gradient(#f9d8df, #fce4ec);
  color: #333;
  margin: 0;
  padding: 40px;
  text-align: center;
}
h1 {
  font-size: 28px;
  color: #283046;
  margin-bottom: 10px;
}
.description-box {
  background: #fff;
  border: 4px solid #283046;
  border-radius: 16px;
  display: inline-block;
  padding: 20px 30px;
  margin: 25px 0 35px 0;
  max-width: 600px;
  box-shadow: 6px 6px 0 rgba(40,48,70,0.3);
}
.search-bar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}
.search-bar input {
  padding: 10px 15px;
  border: 2px solid #283046;
  border-radius: 10px;
  width: 220px;
  font-family: inherit;
  background: #fff;
}
.search-bar button {
  background: #283046;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 10px;
  cursor: pointer;
}
.search-bar button:hover { background: #47516d; }

.cards {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 20px;
}
.card {
  background: #f9d8df;
  border: 3px solid #283046;
  border-radius: 16px;
  width: 200px;
  padding: 15px;
  text-align: center;
  box-shadow: 6px 6px 0 rgba(40,48,70,0.3);
}
.card h3 { color: #283046; }
.card button {
  margin-top: 10px;
  background: #283046;
  color: #fff;
  border: none;
  padding: 8px 15px;
  border-radius: 8px;
  cursor: pointer;
}
.card button:hover { background: #47516d; }

#results {
  margin-top: 40px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  background: #fff;
  border: 3px solid #283046;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 8px 8px 0 rgba(40,48,70,0.2);
}
.article { margin-bottom: 15px; text-align: left; }
.article b { color: #283046; }
</style>
</head>
<body>
  <h1>Ms. Infinite Loop 🌸</h1>

  <div class="description-box">
    <p><b>Ready to discover some brilliance?</b><br>
    Ask me a keyword or click the button to uncover sparkling stories of women in tech from the <b>Past</b>, <b>Present</b>, and <b>Future!</b></p>
  </div>

  <div class="search-bar">
    <input id="keyword" placeholder="Type a keyword (e.g. AI, code)">
    <button onclick="searchArticles()">Search</button>
  </div>

  <div class="cards">
    <div class="card">
      <h3>Past</h3>
      <button onclick="fetchArticles('past')">Explore Past</button>
    </div>
    <div class="card">
      <h3>Present</h3>
      <button onclick="fetchArticles('present')">Explore Present</button>
    </div>
    <div class="card">
      <h3>Future</h3>
      <button onclick="fetchArticles('future')">Explore Future</button>
    </div>
  </div>

  <div id="results"><em>Click a category or use the search bar above 💡</em></div>

  <script>
  async function fetchArticles(bucket){
    const res = await fetch("/articles", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({bucket})
    });
    const data = await res.json();
    renderResults(data, bucket);
  }

  async function searchArticles(){
    const query = document.getElementById("keyword").value.trim();
    const res = await fetch("/articles", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({bucket: "all", query})
    });
    const data = await res.json();
    renderResults(data, "search");
  }

  function renderResults(data, bucket){
    const results = document.getElementById("results");
    if(!data.length){
      results.innerHTML = `<p><b>No results found for "${bucket}"</b></p>`;
      return;
    }
    results.innerHTML = `<h3>Results for ${bucket}</h3>` +
      data.map(a=>`
        <div class="article">
          <b>${a.title}</b><br>
          <small>${a.snippet}</small>
        </div>`).join("");
  }
  </script>
</body>
</html>
