<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ms. Infinite Loop</title>
<style>
body {
  font-family: "Pixelify Sans", monospace;
  background: linear-gradient(#f9d8df, #fce4ec);
  color: #333;
  margin: 0;
  padding: 40px;
  text-align: center;
}

/* Title and logo */
h1 {
  font-size: 32px;
  color: #283046;
  margin-bottom: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
}
h1 .logo {
  order: 2;
  width: 80px;
  height: 80px;
  image-rendering: pixelated;
  animation: gentleFloat 4s ease-in-out infinite;
}
@keyframes gentleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* Main content box */
.description-box {
  background: #fff;
  border: 4px solid #283046;
  border-radius: 16px;
  display: inline-block;
  padding: 20px 30px;
  margin: 25px 0 35px 0;
  max-width: 600px;
  box-shadow: 6px 6px 0 rgba(40,48,70,0.3);
}

/* Search bar */
.search-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}
.search-bar input {
  padding: 10px 15px;
  border: 2px solid #283046;
  border-radius: 10px;
  width: 220px;
  font-family: inherit;
  background: #fff;
}
.search-bar button {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}
.search-bar button img {
  width: 45px;
  height: 45px;
  image-rendering: pixelated;
  transition: transform 0.2s ease;
}
.search-bar button img:hover { transform: scale(1.1); }

/* Cards */
.cards {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 20px;
}
.card {
  background: #f9d8df;
  border: 3px solid #283046;
  border-radius: 16px;
  width: 220px;
  padding: 15px;
  text-align: center;
  box-shadow: 6px 6px 0 rgba(40,48,70,0.3);
  transition: transform 0.2s ease;
}
.card:hover { transform: translateY(-5px); }
.card h3 { color: #283046; }
.card button {
  margin-top: 10px;
  background: #283046;
  color: #fff;
  border: none;
  padding: 8px 15px;
  border-radius: 8px;
  cursor: pointer;
}
.card button:hover { background: #47516d; }

.card img {
  width: 120px;
  height: auto;
  image-rendering: pixelated;
  margin-bottom: 10px;
}

/* Articles */
.article { margin-bottom: 15px; text-align: left; }
.article b a { color: #283046; text-decoration: none; }
.article b a:hover { text-decoration: underline; }

/* Pixel girl */
#pixel-girl {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 120px;
  image-rendering: pixelated;
  pointer-events: none;
  z-index: 9999;
}
</style>
</head>
<body>
  <h1>
    Ms. Infinite Loop
    <img src="{{ url_for('static', filename='Infinite_Logo.gif') }}" alt="Infinite Logo" class="logo">
  </h1>

  <div class="description-box" id="desc-box">
    <p><b>Ready to discover some brilliance?</b><br>
    Ask me a keyword or click the button to uncover sparkling stories of women in tech from the <b>Past</b>, <b>Present</b>, and <b>Future!</b></p>
  </div>

  <div class="search-bar">
    <input id="keyword" placeholder="Type a keyword (e.g. AI, code)">
    <button onclick="fetchArticles('present')">
      <img src="{{ url_for('static', filename='Search_Icon.gif') }}" alt="Search Icon">
    </button>
  </div>

  <div class="cards">
    <div class="card">
      <h3>Past</h3>
      <img src="{{ url_for('static', filename='Past.gif') }}" alt="Past Girl">
      <button onclick="fetchArticles('past')">Explore Past</button>
    </div>

    <div class="card">
      <h3>Present</h3>
      <img src="{{ url_for('static', filename='Present.gif') }}" alt="Present Girl">
      <button onclick="fetchArticles('present')">Explore Present</button>
    </div>

    <div class="card">
      <h3>Future</h3>
      <img src="{{ url_for('static', filename='Future.gif') }}" alt="Future Girl">
      <button onclick="fetchArticles('future')">Explore Future</button>
    </div>
  </div>

  <img id="pixel-girl" src="{{ url_for('static', filename='Girl_Idle_pose1.png') }}" alt="Pixel Girl">

  <script>
  let keywordAccepted = false;

  async function fetchArticles(bucket){
    const query = document.getElementById("keyword").value.trim();
    if (!query) {
      alert("Please type a keyword first!");
      return;
    }

    if (!keywordAccepted) {
      alert("Press Enter first to confirm your keyword!");
      return;
    }

    const res = await fetch("/articles", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({bucket, query})
    });
    let data = await res.json();

    // Shuffle for randomness
    for (let i = data.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [data[i], data[j]] = [data[j], data[i]];
    }

    renderResults(data, bucket);
  }

  function renderResults(data, bucket){
    const descBox = document.getElementById("desc-box");
    if(!data.length){
      descBox.innerHTML = `<p><b>No results found for "${bucket}".</b></p>`;
      return;
    }

    descBox.innerHTML = `<h3>Top 3 results for ${bucket}</h3>` +
      data.map(a=>`
        <div class="article">
          <b><a href="${a.link}" target="_blank">${a.title}</a></b><br>
          <small>${a.snippet}</small>
        </div>`).join("");
  }

  // --- Enter confirms keyword (no fetch yet) ---
  const input = document.getElementById("keyword");
  const descBox = document.getElementById("desc-box");
  const acceptedMsg = `
    <p><b>Key Word Accepted!</b><br>
    Click <b>Past</b>, <b>Present</b>, or <b>Future</b> to explore and see Ms. Infinite Loop’s results ↑↑↑</p>
  `;

  input.addEventListener("keydown", (e)=>{
    if (e.key === "Enter") {
      const q = input.value.trim();
      if (!q) {
        alert("Please type a keyword first!");
        return;
      }
      keywordAccepted = true;
      descBox.innerHTML = acceptedMsg;
    }
  });

  // Idle animation
  let currentPose = 1;
  setInterval(() => {
    const girl = document.getElementById("pixel-girl");
    if (!girl) return;
    currentPose = currentPose === 1 ? 2 : 1;
    girl.src = currentPose === 1
      ? "{{ url_for('static', filename='Girl_Idle_pose1.png') }}"
      : "{{ url_for('static', filename='Girl_Idle_pose2.png') }}";
  }, 600);
  </script>
</body>
</html>
