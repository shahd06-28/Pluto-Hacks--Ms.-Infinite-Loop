<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ms. Infinite Loop 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    background:url("{{ url_for('static', filename='Website_BG.png') }}") no-repeat center center fixed;
    background-size:cover;
    font-family:"Pixelify Sans",sans-serif;
    color:#1f2a44;
    image-rendering:pixelated;
    overflow-x:hidden;
  }
  .center-frame{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
  }
  .center-frame img{max-width:500px;display:block;margin:auto;}
  .generate-btn{
    display:block;
    margin:20px auto;
    width:250px;
    cursor:pointer;
  }
  .cards{
    display:flex;
    justify-content:center;
    gap:60px;
    margin-top:420px;
  }
  .card{position:relative;text-align:center;cursor:pointer;}
  .card img{width:180px;display:block;margin:auto;}
  .char{
    position:fixed;
    bottom:28px;
    right:36px;
    display:flex;
    align-items:flex-end;
    gap:10px;
  }
  .bubble{
    position:relative;
    width:130px;
    height:50px;
  }
  .bubble img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .sprite{width:120px;}
</style>
</head>
<body>

<div class="center-frame">
  <img src="{{ url_for('static', filename='Description_frame.png') }}" alt="Frame">
  <img src="{{ url_for('static', filename='Description_text.png') }}" alt="Text" style="margin-top:-250px;">
  <img class="generate-btn" src="{{ url_for('static', filename='Gen_article_button.png') }}" id="searchBtn" alt="Generate">
</div>

<div class="cards">
  <div class="card" data-bucket="past">
    <img src="{{ url_for('static', filename='Past.png') }}" alt="Past">
  </div>
  <div class="card" data-bucket="present">
    <img src="{{ url_for('static', filename='Present.png') }}" alt="Present">
  </div>
  <div class="card" data-bucket="future">
    <img src="{{ url_for('static', filename='Future.png') }}" alt="Future">
  </div>
</div>

<div class="char">
  <div class="bubble"><img id="phrase" src="{{ url_for('static', filename='Hello_phrase.png') }}" alt=""></div>
  <img id="girl" class="sprite" src="{{ url_for('static', filename='Pixel-1.png 1.png') }}" alt="">
</div>

<script>
const phrases=[
  "Hello_phrase.png","French_phrase.png","Spanish_phrase.png","Chinese_phrase.png",
  "Hindi_phrase.png","Korean_phrase.png","Japanese_phrase.png","Russian_phrase.png",
  "Creole_phrase.png","Urdu_phrase.png"
];
let i=0;
setInterval(()=>{
  i=(i+1)%phrases.length;
  document.getElementById("phrase").src=`/static/${phrases[i]}`;
},3000);

let f=1;
setInterval(()=>{
  f=f===1?2:1;
  document.getElementById("girl").src=`/static/Pixel-${f}.png 1.png`;
},800);

document.getElementById("searchBtn").onclick=()=>doSearch();

async function doSearch(bucket=null){
  const res=await fetch("/articles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:"women in tech",bucket})});
  const data=await res.json();
  console.log(data);
}
</script>
</body>
</html>
