<body>
  <!-- Header -->
  <div class="topbar">
    <div class="brand">
      <img src="{{ url_for('static', filename='final_assets/Group.png') }}" alt="Logo">
    </div>
    <div class="search">
      <input id="query" placeholder="Search">
      <button id="searchBtn">
        <img src="{{ url_for('static', filename='final_assets/Search 1.png') }}" alt="🔍">
      </button>
    </div>
  </div>

  <!-- Description -->
  <div class="desc">
    <img class="frame" src="{{ url_for('static', filename='final_assets/Description_BG.png') }}" alt="Frame">
    <img class="text" src="{{ url_for('static', filename='final_assets/Description_text.png') }}" alt="Text">
  </div>

  <!-- Generate button -->
  <button id="generateBtn" class="generate-btn">
    <img src="{{ url_for('static', filename='final_assets/Gen_article_button.png') }}" alt="Generate Articles">
  </button>

  <!-- Cards -->
  <div class="cards">
    <div class="card" data-bucket="past">
      <div class="label">Past</div>
      <img class="char" src="{{ url_for('static', filename='final_assets/Past.png') }}" alt="Past Character">
      <img class="button" src="{{ url_for('static', filename='final_assets/Past_button.png') }}" alt="Past Button">
    </div>

    <div class="card" data-bucket="present">
      <div class="label">Present</div>
      <img class="char" src="{{ url_for('static', filename='final_assets/Present.png') }}" alt="Present Character">
      <img class="button" src="{{ url_for('static', filename='final_assets/Present_button.png') }}" alt="Present Button">
    </div>

    <div class="card" data-bucket="future">
      <div class="label">Future</div>
      <img class="char" src="{{ url_for('static', filename='final_assets/Future.png') }}" alt="Future Character">
      <img class="button" src="{{ url_for('static', filename='final_assets/Future_button.png') }}" alt="Future Button">
    </div>
  </div>

  <!-- Character -->
  <div class="character">
    <div class="speech" id="speechText">Hello!</div>
    <img id="girlSprite" class="girl" src="{{ url_for('static', filename='final_assets/Pixel-1.png') }}" alt="Girl">
  </div>

  <!-- Modal -->
  <div id="backdrop" class="modal-backdrop">
    <div class="modal">
      <span class="close-btn" onclick="closeModal()">✖</span>
      <h2 id="modalTitle">Results</h2>
      <div id="modalBody">Loading…</div>
    </div>
  </div>

  <script>
    // Rotate speech phrases
    const phrases=["Hello!","مرحبًا","안녕하세요","Hola","こんにちは","Bonjour","你好","Привет","Bonjou","नमस्ते","نمستے"];
    let i=0;
    setInterval(()=>{i=(i+1)%phrases.length;document.getElementById("speechText").textContent=phrases[i];},3000);

    // Girl idle animation
    let f=1;
    setInterval(()=>{f=f===1?2:1;document.getElementById("girlSprite").src=`/static/final_assets/Pixel-${f}.png`;},600);

    // Modal functions
    function openModal(title,html){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=html;document.getElementById("backdrop").style.display="flex";}
    function closeModal(){document.getElementById("backdrop").style.display="none";}

    // Fetch articles
    async function fetchArticles(bucket,query){
      const res=await fetch("/articles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query,bucket})});
      const data=await res.json();
      if(data.error) return openModal("Error",data.error);
      const html=(data.articles||[]).map(a=>`<div class='article'><b>${a.title}</b><br><div>${a.snippet||""}</div><a href='${a.link}' target='_blank'>🔗 Link</a></div>`).join("")||"<div>No results.</div>";
      openModal(bucket.charAt(0).toUpperCase()+bucket.slice(1),html);
    }

    // Button handlers
    document.querySelectorAll(".card img.button").forEach(btn=>{
      btn.onclick=()=>{const bucket=btn.parentElement.dataset.bucket;fetchArticles(bucket,bucket);}
    });
    document.getElementById("generateBtn").onclick=()=>{const q=document.getElementById("query").value.trim()||"women in tech";fetchArticles("all",q);}
    document.getElementById("searchBtn").onclick=()=>{const q=document.getElementById("query").value.trim();if(q) fetchArticles("search",q);}
  </script>
</body>
